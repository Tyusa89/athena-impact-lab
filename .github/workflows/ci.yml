name: CI

# Continuous integration for pull requests into main.
# Runs the full test suite, the TypeScript check and the production build.
# It needs no secrets and makes no model calls: the Meta/Muse Spark adapter is gated off by default
# (META_MODEL_ENABLED is not "true", no API key is set) and every test uses a local fake `fetch`.
on:
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Defence in depth: keep the live model path disabled regardless of the runner environment.
      META_MODEL_ENABLED: "false"
    steps:
      # Third-party actions are pinned to full commit SHAs (the comment names the release).
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # vite/nitro require Node ^20.19 || >=22.12; the project is developed on Node 22.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # bun.lock (text lockfile) is the project's lockfile; this is the Bun version it was produced with.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Confirm no model credentials are present
        run: |
          if [ -n "${META_MODEL_API_KEY:-}" ]; then
            echo "::error::META_MODEL_API_KEY must not be set in CI; tests never call the live model."
            exit 1
          fi

      # Fails if bun.lock is out of date with package.json instead of silently changing it.
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Build
        run: bun run build
